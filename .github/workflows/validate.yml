name: Validate repository

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate documentation, HTML, scripts, and repository files
        run: python scripts/validate_repo.py
      - name: Verify skill discovery and temporary Codex copy install
        run: python scripts/validate_repo.py --skill-smoke
