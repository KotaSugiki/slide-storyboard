name: 不具合報告
description: スキル、テンプレート、検証手順の不具合を報告する
title: "[不具合] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 起きたことを簡潔に説明してください。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 再現手順
      description: 入力、実行した手順、実際の結果を記載してください。機密情報は含めないでください。
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: エージェントとバージョン
      placeholder: 例 Codex、バージョン
  - type: textarea
    id: expected
    attributes:
      label: 期待する結果
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: 確認事項
      options:
        - label: 既存 Issue を検索しました。
          required: true
        - label: 機密情報、認証情報、利用者データを記載していません。
          required: true
